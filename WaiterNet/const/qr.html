<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Invoice</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet" type="text/css" />

    <style type="text/css">

        .qr-wrapper {
            background-color: #eee;
            display: inline-block;
            border-radius: 20px;
        }

        .qr {
            border: 1px solid #555;
            max-width: 50vw;
            opacity: 0.8;
            border-radius: 20px;
        }

        .drop-shadow {
            box-shadow: 0px 0px 5px rgba(0,0,0,0.1);
        }

        .logo {
            max-width: 200px;
        }

        h1 {
            text-align: center;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="text-center m-5">
            <h1>{Vendor.Name}</h1>
            <h2>{Table.Name}</h2>
            <div class="qr-wrapper p-5 mt-5 mb-5">
                <img src="{QR.URL}" alt="" class="img-fluid mx-auto d-block qr drop-shadow" />
            </div>
            <img src="/img/logo.png" alt="" class="d-block mx-auto logo" />
        </div>
    </div>
</body>
</html>
