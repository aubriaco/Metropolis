		<!--start page wrapper -->
<div class="page-wrapper" ng-controller="Login">
    <div class="page-content" ng-init="resetPassword()">
        <!--start breadcrumb-->
        <section class="py-3 border-bottom border-top d-none d-md-flex bg-light">
            <div class="container">
                <div class="page-breadcrumb d-flex align-items-center">
                    <h3 class="breadcrumb-title pe-3">{{getLang('Reset Password')}}</h3>
                    <div class="ms-auto">
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-0 p-0">
                                <li class="breadcrumb-item">
                                    <a href="/"><i class="bx bx-home-alt"></i>{{getLang('Home')}}</a>
                                </li>
                                <li class="breadcrumb-item">
                                    <a href="javascript:;">{{getLang('Authentication')}}</a>
                                </li>
                                <li class="breadcrumb-item active" aria-current="page">{{getLang('Reset Password')}}</li>
                            </ol>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
        <!--end breadcrumb-->
        <!--start shop cart-->
        <div>
            <section class="py-0 py-lg-5">
                <div class="container">
                    <div class="section-authentication-signin d-flex align-items-center justify-content-center my-5">
                        <div class="row row-cols-1">
                            <div class="col mx-auto">
                                <div class="card mb-0">
                                    <div class="card-body">
                                        <div class="border p-4 rounded">
                                            <div class="text-center">
                                                <h3 class="">{{getLang('Reset Password')}}</h3>
                                            </div>
                                            <div class="login-separater text-center mb-4">
                                                <hr />
                                            </div>
                                            <div class="form-body">
                                                <form class="row g-3" ng-submit="submit()">
                                                    <div class="col-12">
                                                        <label for="inputChoosePassword" class="form-label">{{getLang('Password')}}</label>
                                                        <div class="input-group show_hide_password">
                                                            <input ng-model="Form.password" ng-required="true" ng-minlength="6" type="password" class="form-control border-end-0" id="inputChoosePassword" value="12345678" placeholder="Enter Password"> <a href="javascript:;" class="input-group-text bg-transparent"><i class="bx bx-hide"></i></a>
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <label for="inputChooseConfirmPassword" class="form-label">{{getLang('Confirm Password')}}</label>
                                                        <div class="input-group show_hide_password">
                                                            <input ng-model="Form.confirmPassword" ng-required="true" ng-minlength="6" type="password" class="form-control border-end-0" id="inputChooseConfirmPassword" value="12345678" placeholder="Confirm Password"> <a href="javascript:;" class="input-group-text bg-transparent"><i class="bx bx-hide"></i></a>
                                                        </div>
                                                    </div>
                                                    <div class="col-12">
                                                        <div class="d-grid">
                                                            <button type="submit" class="btn btn-dark"><i class="bx bx-user"></i>{{getLang('Set New Pasword')}}</button>
                                                        </div>
                                                    </div>
                                                </form>
                                                <div class="mt-4">
                                                    <p> {{getLang('Go back to')}} <a href="/login"> {{getLang('login.')}} </a></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--end row-->
                    </div>
                </div>
            </section>
            <!--end shop cart-->
            
        </div>
    </div>
</div>
<!--end page wrapper -->
<script src="assets/js/show-hide-password.js"></script>
