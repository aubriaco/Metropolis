<div ng-init="accountInfo()">
    <h4>{{getLang('My Account')}}</h4>
    <div ng-show="Error" class="alert alert-danger mb-2">{{Error}}</div>
    <div ng-show="!Info" class="alert alert-info mb-2"> {{getLang('Loading...')}} </div>
    <form ng-submit="saveAccountInfo(Info)" ng-show="Info">
        <div class="row">
            <div class="col-md">
                <label class="form-label d-block"> {{getLang('First Name')}} </label>
                <input ng-model="Info.firstName" ng-required="true" type="text" class="form-control" />
            </div>
            <div class="col-md">
                <label class="form-label d-block"> {{getLang('Last Name')}} </label>
                <input ng-model="Info.lastName" ng-required="true" type="text" class="form-control" />
            </div>
        </div>
        <div ng-show="false" class="row">
            <div class="col-md">
                <label class="form-label d-block mt-2"> {{getLang('E-mail')}} </label>
                <input ng-model="Info.email" ng-required="true" type="email" class="form-control" />
            </div>
            <div class="col-md">
                <label class="form-label d-block mt-2"> {{getLang('Phone')}} </label>
                <input ng-model="Info.phone" ng-required="true" type="tel" class="form-control" />
            </div>
        </div>
        <div class="float-end btn-group mt-4">
            <button ng-disabled="Saving" type="submit" class="btn btn-success"><i class="bx bx-save"></i> {{getLang('Save')}} </button>
            <button ng-click="loadAccount()" ng-disabled="Saving" type="button" class="btn btn-primary"><i class="bx bx-reset"></i> {{getLang('Reset')}} </button>
        </div>
        <div class="clearfix"></div>
    </form>
</div>
